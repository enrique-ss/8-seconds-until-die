<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8 Seconds Until Die</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="terminal">
      <header class="topbar">
        <span>8 SECONDS UNTIL DIE</span>
        <span id="clock">08.0</span>
      </header>

      <section id="log" class="log" aria-live="polite"></section>

      <section class="choices">
        <button class="choice" data-slot="1"></button>
        <button class="choice" data-slot="2"></button>
        <button class="choice" data-slot="3"></button>
        <button class="choice" data-slot="4"></button>
        <button class="choice" data-slot="5"></button>
        <button class="choice" data-slot="6"></button>
        <button class="choice" data-slot="7"></button>
        <button class="choice" data-slot="8"></button>
        <button class="choice" data-slot="9"></button>
      </section>

      <button id="restartBtn" class="restart hidden">REINICIAR</button>
    </main>

    <script src="game.js"></script>
  </body>
</html>
